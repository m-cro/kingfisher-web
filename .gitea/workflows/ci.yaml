name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  deploy:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested commit
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST http://127.0.0.1:5910/deploy/web \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"run_id\":\"${GITHUB_RUN_ID}\",\"sha\":\"${GITHUB_SHA}\"}"

  publish-image:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Build and publish
        env:
          GHCR_SHA_IMAGE: ghcr.io/m-cro/kingfisher-web:${{ github.sha }}
          GHCR_LATEST_IMAGE: ghcr.io/m-cro/kingfisher-web:latest
        run: |
          docker build --build-arg COMMIT_HASH="${GITHUB_SHA}" --build-arg COMMIT_SHORT="${GITHUB_SHA::7}" \
            --tag "$GHCR_SHA_IMAGE" --tag "$GHCR_LATEST_IMAGE" .
          docker push "$GHCR_SHA_IMAGE"
          docker push "$GHCR_LATEST_IMAGE"
